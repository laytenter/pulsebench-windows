name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build portable Windows app
        run: npm run dist:win

      - name: Smoke-test packaged Windows app
        run: .\release\win-unpacked\PulseBench.exe --smoke-test
        timeout-minutes: 3

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: PulseBench-Windows-x64
          path: release/*.exe
          if-no-files-found: error
